version: "2"
run:
  tests: true
linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unused
  settings:
    misspell:
      locale: US
    revive:
      severity: warning
      rules:
        - name: exported
          arguments:
            - checkPrivateReceivers
            - disableStutteringCheck
          disabled: false
        # var-naming flags Id→ID / Url→URL on exported fields (Resource.Id,
        # Config.BaseUrl, App*.BundleId, …). Correcting those is a breaking API
        # change, so it is deferred to the v2 module rename. Re-enable then.
        - name: var-naming
          disabled: true
        - name: context-as-argument
        - name: error-return
        - name: error-strings
        - name: if-return
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - revive
          - staticcheck
        path: app-store-server/
      - linters:
          - revive
          - staticcheck
        path: app-store-server-notifications/
      - linters:
          - revive
          - staticcheck
        path: types/
      - linters:
          - revive
        path: _test\.go
    paths:
      - examples
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - examples
      - third_party$
      - builtin$
      - examples$
