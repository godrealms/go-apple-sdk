name: govulncheck

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly backstop: catches newly disclosed vulnerabilities even when the
    # code has not changed (the vuln database is updated continuously).
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
